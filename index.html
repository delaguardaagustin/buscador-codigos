<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscador de códigos · muestra</title>
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  :root { --fondo:#f4f1ea; --tarjeta:#fff; --tinta:#1c1b19; --suave:#6b665d; --linea:#ddd6c8; --verde:#0f6b3f; --verde-claro:#e3f1e8; --aviso:#8a5a00; --aviso-fondo:#fdf1d3; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fondo); color:var(--tinta); font:17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  header { position:sticky; top:0; z-index:5; background:var(--fondo); padding:14px 16px 10px; border-bottom:1px solid var(--linea); }
  h1 { margin:0 0 10px; font-size:20px; letter-spacing:-.01em; }
  .fila { display:flex; gap:10px; }
  #q { flex:1; min-width:0; height:56px; padding:0 16px; font-size:19px; border:2px solid var(--tinta); border-radius:12px; background:#fff; color:var(--tinta); }
  #q:focus { outline:3px solid var(--verde); outline-offset:1px; }
  .foto { flex:none; height:56px; padding:0 18px; display:flex; align-items:center; gap:8px; border-radius:12px; background:var(--verde); color:#fff; font-weight:700; font-size:17px; cursor:pointer; }
  .foto svg { width:24px; height:24px; }
  .foto input { position:absolute; opacity:0; width:1px; height:1px; }
  #cats { display:flex; gap:8px; overflow-x:auto; padding:10px 0 2px; scrollbar-width:none; }
  #cats::-webkit-scrollbar { display:none; }
  #cats button { flex:none; height:44px; padding:0 16px; border:1px solid var(--linea); border-radius:22px; background:#fff; font:inherit; font-weight:600; color:var(--tinta); cursor:pointer; }
  #cats button[aria-pressed="true"] { background:var(--tinta); color:#fff; border-color:var(--tinta); }
  main { padding:12px 16px 90px; max-width:760px; margin:0 auto; }
  #estado { margin:0 0 10px; color:var(--suave); font-size:15px; min-height:21px; }
  #estado.aviso { background:var(--aviso-fondo); color:var(--aviso); padding:10px 12px; border-radius:10px; }
  .grupo { margin:14px 0 6px; font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--verde); }
  .lista { display:grid; gap:8px; }
  .prod { display:flex; align-items:center; gap:14px; width:100%; min-height:64px; padding:10px 14px; text-align:left; background:var(--tarjeta); border:1px solid var(--linea); border-radius:12px; font:inherit; color:inherit; cursor:pointer; }
  .prod:active { background:var(--verde-claro); }
  .prod b { flex:none; min-width:78px; font-size:26px; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .prod span { flex:1; }
  .prod small { display:block; color:var(--aviso); font-size:13px; }
  .vacio { padding:30px 10px; text-align:center; color:var(--suave); }
  #miniatura { display:none; width:96px; height:96px; object-fit:cover; border-radius:12px; border:1px solid var(--linea); float:right; margin:0 0 8px 12px; }
  dialog { width:min(92vw, 460px); border:0; border-radius:18px; padding:22px 20px 18px; text-align:center; color:var(--tinta); }
  dialog::backdrop { background:rgba(20,18,14,.6); }
  dialog h2 { margin:0 0 4px; font-size:22px; }
  dialog .num { font-size:84px; font-weight:800; line-height:1; margin:10px 0 6px; font-variant-numeric:tabular-nums; }
  dialog p { margin:6px 0; color:var(--suave); font-size:15px; }
  dialog svg { max-width:100%; height:auto; }
  dialog button { margin-top:12px; width:100%; height:54px; border:0; border-radius:12px; background:var(--tinta); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  footer { position:fixed; left:0; right:0; bottom:0; padding:8px 16px calc(8px + env(safe-area-inset-bottom)); background:var(--fondo); border-top:1px solid var(--linea); font-size:13px; color:var(--suave); text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Buscador de códigos</h1>
  <div class="fila">
    <input id="q" type="search" placeholder="Buscar: jamón, queso…" autocomplete="off" aria-label="Buscar producto por nombre o código">
    <label class="foto" id="btn-foto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Foto
      <input id="archivo" type="file" accept="image/*" capture="environment" aria-label="Sacar una foto del producto">
    </label>
  </div>
  <nav id="cats" aria-label="Categorías"></nav>
</header>
<main>
  <img id="miniatura" alt="Foto tomada">
  <p id="estado" role="status" aria-live="polite"></p>
  <div id="res"></div>
</main>
<footer>Muestra con los códigos de sus hojas · hecha por SENTRY-CODE</footer>

<dialog id="dlg" aria-labelledby="dlg-nombre">
  <h2 id="dlg-nombre"></h2>
  <div class="num" id="dlg-num"></div>
  <p id="dlg-nota"></p>
  <svg id="dlg-barra" role="img" aria-label="Código de barras"></svg>
  <p>Marque el número en la balanza o pase el lector por el código de barras.</p>
  <button id="dlg-cerrar" type="button">Listo</button>
</dialog>

<script type="module">
import { PRODUCTOS, CATEGORIAS, GRUPOS } from './catalogo.js';

const $ = (s) => document.querySelector(s);
const sinTildes = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let cat = '', porFoto = null;                       // porFoto: [{grupo, pct}] cuando se está mostrando el resultado de una foto

function fila(p) {
  return '<button class="prod" type="button" data-cod="' + p.codigo + '"><b>' + p.codigo + '</b><span>' + esc(p.nombre) +
    (p.confirmar ? '<small>Código por confirmar: en la hoja no se leía bien</small>' : '') + '</span></button>';
}

function pintar() {
  const q = sinTildes($('#q').value.trim()), palabras = q.split(/\s+/).filter(Boolean);
  let html = '';
  if (porFoto && !q) {
    for (const { grupo, pct } of porFoto) {
      const ps = PRODUCTOS.filter(p => p.grupo === grupo);
      html += '<h2 class="grupo">' + esc(GRUPOS[grupo][0]) + ' · ' + pct + ' % de parecido</h2><div class="lista">' + ps.map(fila).join('') + '</div>';
    }
  } else {
    const ps = PRODUCTOS.filter(p => (!cat || p.categoria === cat) &&
      palabras.every(w => sinTildes(p.nombre).includes(w) || p.codigo.startsWith(w)));
    $('#estado').className = ''; $('#miniatura').style.display = 'none';
    $('#estado').textContent = ps.length + (ps.length === 1 ? ' producto' : ' productos');
    html = ps.length ? '<div class="lista">' + ps.map(fila).join('') + '</div>' : '<p class="vacio">No hay ningún producto con ese nombre. Pruebe con otra palabra.</p>';
  }
  $('#res').innerHTML = html;
}

$('#cats').innerHTML = ['', ...CATEGORIAS].map(c => '<button type="button" data-cat="' + c + '" aria-pressed="' + (c === cat) + '">' + (c || 'Todos') + '</button>').join('');
$('#cats').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  cat = b.dataset.cat; porFoto = null;
  document.querySelectorAll('#cats button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  pintar();
});
$('#q').addEventListener('input', () => { porFoto = null; pintar(); });

$('#res').addEventListener('click', (e) => {
  const b = e.target.closest('.prod'); if (!b) return;
  const p = PRODUCTOS.find(x => x.codigo === b.dataset.cod);
  $('#dlg-nombre').textContent = p.nombre; $('#dlg-num').textContent = p.codigo;
  $('#dlg-nota').textContent = p.confirmar ? 'Código por confirmar con la hoja original.' : p.categoria;
  try { JsBarcode('#dlg-barra', p.codigo, { format: 'CODE128', width: 3, height: 90, displayValue: false, margin: 8 }); $('#dlg-barra').style.display = ''; }
  catch { $('#dlg-barra').style.display = 'none'; }
  $('#dlg').showModal();
});
$('#dlg-cerrar').addEventListener('click', () => $('#dlg').close());

/* ---------- Reconocer por foto: el modelo corre en el mismo teléfono, la foto no se envía a ningún servidor ---------- */
let clasificador = null;
const claves = Object.keys(GRUPOS), frases = claves.map(k => 'a photo of ' + GRUPOS[k][1]);
async function cargarModelo() {
  if (clasificador) return clasificador;
  const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
  env.allowLocalModels = false;
  clasificador = await pipeline('zero-shot-image-classification', 'Xenova/clip-vit-base-patch32', {
    progress_callback: (x) => { if (x.status === 'progress' && x.total > 5e6) decir('Preparando el reconocimiento por primera vez… ' + Math.round(x.progress) + ' %'); },
  });
  return clasificador;
}
function decir(t, aviso) { $('#estado').textContent = t; $('#estado').className = aviso ? 'aviso' : ''; }

async function reconocer(archivo) {
  if (!archivo.type.startsWith('image/')) { decir('Ese archivo no es una foto. Pruebe de nuevo con la cámara.', true); return; }
  const url = URL.createObjectURL(archivo);
  $('#miniatura').src = url; $('#miniatura').style.display = 'block';
  $('#q').value = ''; $('#res').innerHTML = '';
  decir('Mirando la foto…');
  try {
    const c = await cargarModelo();
    decir('Mirando la foto…');
    const r = await c(url, frases);
    const mejores = r.slice(0, 3).map(x => ({ grupo: claves[frases.indexOf(x.label)], pct: Math.round(x.score * 100) })).filter(x => x.pct >= 15);   /* bajo 15 % es ruido: no se muestra */
    window.__ultimaFoto = mejores;
    const seguro = mejores.length && mejores[0].pct >= 45;   /* con menos parecido se equivoca seguido: mejor decirlo */
    porFoto = mejores.length ? mejores : null;
    pintar();
    $('#miniatura').style.display = 'block';
    if (seguro) decir('Parece ' + GRUPOS[mejores[0].grupo][0].toLowerCase() + '. Toque el producto correcto.');
    else decir(mejores.length ? 'No estoy seguro. Puede ser alguno de estos; si no está, escriba el nombre.' : 'No reconozco el producto. Escriba el nombre.', true);
  } catch (err) {
    console.error(err); porFoto = null;
    decir('No se pudo usar la cámara inteligente (revise la conexión). Escriba el nombre del producto.', true);
  }
}
$('#archivo').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) reconocer(f); });
window.__reconocer = reconocer; window.__precargar = cargarModelo;                     // para las pruebas automáticas

pintar();
</script>
</body>
</html>
